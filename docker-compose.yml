services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: sh -c "composer install --no-interaction && if [ -z \"$APP_KEY\" ]; then php artisan key:generate --force; fi && php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  vendor:
  node_modules: